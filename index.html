<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Team_Autism™ reCAPTCHA Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .captcha-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 350px;
        }
        h2 { color: #1a73e8; margin-bottom: 10px; font-size: 22px; }
        p { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
        
        .recaptcha-widget-mock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            margin: 0 auto;
            padding: 0 10px 0 14px;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-mock {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            background: #fff;
            margin-right: 14px;
            position: relative;
            transition: all 0.2s;
        }
        .checkbox-container:hover .checkbox-mock {
            border-color: #b2b2b2;
        }
        .checkbox-text {
            font-size: 14px;
            color: #2c2c2c;
            font-weight: 400;
        }
        
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid #4d90fe;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 0; left: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .checkmark {
            display: none;
            width: 28px;
            height: 28px;
            position: absolute;
            top: -2px; left: -2px;
        }
        .checkmark:after {
            content: '';
            position: absolute;
            left: 9px; top: 4px;
            width: 7px; height: 14px;
            border: solid #00aa00;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 75px;
        }
        .logo-section svg {
            width: 32px;
            height: 32px;
        }
        .logo-section span {
            font-size: 8px;
            color: #555;
            margin-top: 2px;
            font-family: Roboto, helvetica, arial, sans-serif;
        }
        .logo-section a {
            font-size: 8px;
            color: #555;
            text-decoration: none;
        }

        .token-box {
            display: none;
            margin-top: 25px;
            padding: 12px;
            background: #e8f0fe;
            border: 1px dashed #1a73e8;
            font-family: monospace;
            font-size: 15px;
            color: #1a73e8;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
    <script>
        function triggerCaptcha() {
            const checkbox = document.getElementById('box');
            const spinner = document.getElementById('spin');
            const checkmark = document.getElementById('check');
            
            document.getElementById('clickzone').style.pointerEvents = 'none';
            checkbox.style.borderColor = 'transparent';
            spinner.style.display = 'block';

            setTimeout(() => {
                spinner.style.display = 'none';
                checkmark.style.display = 'block';
                
                setTimeout(() => {
                    document.getElementById('widget').style.display = 'none';
                    document.getElementById('desc').innerText = 'Проверка успешно пройдена! Скопируйте код и вставьте в консоль:';
                    
                    const secretToken = "TEAM-AUTISM-PASSED-" + Math.floor(1000 + Math.random() * 9000);
                    const tokenBox = document.getElementById('token');
                    tokenBox.innerText = secretToken;
                    tokenBox.style.display = 'block';
                }, 600);

            }, 1200);
        }
    </script>
</head>
<body>

<div class="captcha-container">
    <h2>Проверка безопасности</h2>
    <p id="desc">Для продолжения работы с матрицей подтвердите, что вы не робот.</p>
    
    <div class="recaptcha-widget-mock" id="widget">
        <div class="checkbox-container" id="clickzone" onclick="triggerCaptcha()">
            <div class="checkbox-mock" id="box">
                <div class="spinner" id="spin"></div>
                <div class="checkmark" id="check"></div>
            </div>
            <div class="checkbox-text">Я не робот</div>
        </div>
        <div class="logo-section">
            <!-- Встроенный SVG логотип reCAPTCHA вместо внешней картинки -->
            <svg viewBox="0 0 24 24">
                <path fill="#4A90E2" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z" />
                <path fill="#4A90E2" d="M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                <circle cx="12" cy="12" r="2" fill="#1A73E8"/>
            </svg>
            <span style="font-weight: 500; color: #555;">reCAPTCHA</span>
            <span style="font-size:7px; color:#9b9b9b;"><a href="#">Конфиденциальность</a> - <a href="#">Условия</a></span>
        </div>
    </div>

    <div id="token" class="token-box"></div>
</div>

</body>
</html>
