<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Team_Autism™ reCAPTCHA Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .captcha-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 350px;
        }
        h2 { color: #1a73e8; margin-bottom: 10px; font-size: 22px; }
        p { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
        
        /* Стили оригинального виджета reCAPTCHA */
        .recaptcha-widget-mock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            margin: 0 auto;
            padding: 0 10px 0 14px;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-mock {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            background: #fff;
            margin-right: 14px;
            position: relative;
            transition: all 0.2s;
        }
        .checkbox-container:hover .checkbox-mock {
            border-color: #b2b2b2;
        }
        .checkbox-text {
            font-size: 14px;
            color: #2c2c2c;
            font-weight: 400;
        }
        
        /* Анимация крутилки (spinner) */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #4d90fe;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 0; left: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Зеленая галочка */
        .checkmark {
            display: none;
            width: 28px;
            height: 28px;
            position: absolute;
            top: -2px; left: -2px;
        }
        .checkmark:after {
            content: '';
            position: absolute;
            left: 9px; top: 4px;
            width: 7px; height: 14px;
            border: solid #00aa00;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* Логотип Google */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
        }
        .logo-section img {
            width: 32px;
            height: 32px;
        }
        .logo-section span {
            font-size: 8px;
            color: #555;
            margin-top: 2px;
        }
        .logo-section a {
            font-size: 8px;
            color: #555;
            text-decoration: none;
        }

        /* Поле вывода токена */
        .token-box {
            display: none;
            margin-top: 25px;
            padding: 12px;
            background: #e8f0fe;
            border: 1px dashed #1a73e8;
            font-family: monospace;
            font-size: 15px;
            color: #1a73e8;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
    <script>
        function triggerCaptcha() {
            const checkbox = document.getElementById('box');
            const spinner = document.getElementById('spin');
            const checkmark = document.getElementById('check');
            
            // Отключаем клики во время анимации
            document.getElementById('clickzone').style.pointerEvents = 'none';
            checkbox.style.borderColor = 'transparent';
            spinner.style.display = 'block';

            // Имитируем "размышление" Google над нашей человечностью (1.5 секунды)
            setTimeout(() => {
                spinner.style.display = 'none';
                checkmark.style.display = 'block';
                
                // Плавное появление токены
                setTimeout(() => {
                    document.getElementById('widget').style.display = 'none';
                    document.getElementById('desc').innerText = 'Проверка успешно пройдена! Скопируйте код и вставьте в консоль:';
                    
                    const secretToken = "TEAM-AUTISM-PASSED-" + Math.floor(1000 + Math.random() * 9000);
                    const tokenBox = document.getElementById('token');
                    tokenBox.innerText = secretToken;
                    tokenBox.style.display = 'block';
                }, 600);

            }, 1500);
        }
    </script>
</head>
<body>

<div class="captcha-container">
    <h2>Проверка безопасности</h2>
    <p id="desc">Для продолжения работы с матрицей подтвердите, что вы не робот.</p>
    
    <!-- Самодельный фейк-виджет, идентичный оригиналу -->
    <div class="recaptcha-widget-mock" id="widget">
        <div class="checkbox-container" id="clickzone" onclick="triggerCaptcha()">
            <div class="checkbox-mock" id="box">
                <div class="spinner" id="spin"></div>
                <div class="checkmark" id="check"></div>
            </div>
            <div class="checkbox-text">Я не робот</div>
        </div>
        <div class="logo-section">
            <img src="https://gstatic.com" alt="reCAPTCHA">
            <span>reCAPTCHA</span>
            <span style="font-size:7px; color:#9b9b9b;"><a href="#">Конфиденциальность</a> - <a href="#">Условия</a></span>
        </div>
    </div>

    <div id="token" class="token-box"></div>
</div>

</body>
</html>
