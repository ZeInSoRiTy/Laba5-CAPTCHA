<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Team_Autism™ reCAPTCHA Verification</title>
    <!-- Подключаем официальный скрипт Google -->
    <script src="https://google.com" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .captcha-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; margin-bottom: 20px; }
        .token-box {
            display: none;
            margin-top: 20px;
            padding: 10px;
            background: #e8f0fe;
            border: 1px dashed #1a73e8;
            font-family: monospace;
            font-size: 16px;
            color: #1a73e8;
            font-weight: bold;
        }
    </style>
    <script>
        // Функция, которая сработает сразу после успешного нажатия на галочку
        function onCaptchaSuccess() {
            document.getElementById('captcha-widget').style.display = 'none';
            document.getElementById('desc').innerText = 'Проверка пройдена! Скопируйте код ниже и вставьте в консоль:';
            
            // Генерируем секретный код для консоли C++
            const secretToken = "TEAM-AUTISM-PASSED-" + Math.floor(1000 + Math.random() * 9000);
            
            const tokenBox = document.getElementById('token');
            tokenBox.innerText = secretToken;
            tokenBox.style.display = 'block';
        }
    </script>
</head>
<body>

<div class="captcha-container">
    <h2>Проверка безопасности</h2>
    <p id="desc">Для продолжения работы с матрицей подтвердите, что вы не робот.</p>
    
    <!-- Вставьте ваш Ключ Сайта в параметр data-sitekey вместо текста ниже -->
    <div id="captcha-widget" class="g-recaptcha" 
         data-sitekey="6Lc3O_EtAAAAACIL68dyHfibeEnNKDul485Agn4n" 
         data-callback="onCaptchaSuccess"></div>

    <div id="token" class="token-box"></div>
</div>

</body>
</html>
